name: 'Litmiq evals'
description: 'Run a Litmiq regression suite with your own provider keys and fail the job if scores drop.'
author: 'Litmiq'
branding:
  icon: 'check-circle'
  color: 'purple'
inputs:
  suite:
    description: 'Path to a Litmiq suite JSON (litmiq-suite/1).'
    required: true
    default: 'litmiq/litmiq-suite.json'
  baseline:
    description: 'Path to a baseline JSON to compare against.'
    required: false
    default: 'litmiq/litmiq-baseline.json'
  out:
    description: 'Where to write results JSON.'
    required: false
    default: 'litmiq-results.json'
  update-baseline:
    description: 'If "true", write a new baseline when this run has no regressions.'
    required: false
    default: 'false'
  openai_api_key:
    description: 'OpenAI API key. Prefer a repository secret: openai_api_key: ${{ secrets.OPENAI_API_KEY }}'
    required: false
    default: ''
  anthropic_api_key:
    description: 'Anthropic API key. Prefer a repository secret: anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}'
    required: false
    default: ''
  github_token:
    description: 'Token used to post or update a pull request comment. Defaults to the workflow token. The workflow needs pull-requests: write. Set to empty to skip comments.'
    required: false
    default: ${{ github.token }}
  max_metric_drop:
    description: 'Optional default per-metric average drop allowed versus the baseline (0-10 scale). Leave empty to use suite.ci.max_metric_drop.'
    required: false
    default: ''
  evidence:
    description: 'Where to write the SHA-256 hashed compliance evidence record (prompt hashes, commit, run URL, thresholds, verdict, baseline hash, PR approvals). Set to empty to skip. Upload it with actions/upload-artifact to keep it with the run.'
    required: false
    default: 'litmiq-evidence.json'
outputs:
  evidence:
    description: 'Path of the evidence record, if one was written.'
    value: ${{ steps.run.outputs.evidence }}
runs:
  using: 'composite'
  steps:
    - name: Validate the Litmiq suite
      shell: bash
      run: node "${{ github.action_path }}/litmiq-ci.mjs" "${{ inputs.suite }}" --validate
    - name: Run the Litmiq suite
      id: run
      shell: bash
      env:
        OPENAI_API_KEY: ${{ inputs.openai_api_key }}
        ANTHROPIC_API_KEY: ${{ inputs.anthropic_api_key }}
        GITHUB_TOKEN: ${{ inputs.github_token }}
        GITHUB_REPOSITORY: ${{ github.repository }}
        GITHUB_EVENT_PATH: ${{ github.event_path }}
        GITHUB_API_URL: ${{ github.api_url }}
        LITMIQ_COMMIT_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      run: |
        set -euo pipefail
        args=("${{ inputs.suite }}" --out "${{ inputs.out }}" --baseline "${{ inputs.baseline }}")
        if [ "${{ inputs.update-baseline }}" = "true" ]; then
          args+=(--update-baseline)
        fi
        if [ -n "${{ inputs.max_metric_drop }}" ]; then
          args+=(--max-metric-drop "${{ inputs.max_metric_drop }}")
        fi
        if [ -z "${{ inputs.github_token }}" ]; then
          args+=(--no-pr-comment)
        fi
        if [ -n "${{ inputs.evidence }}" ]; then
          args+=(--evidence "${{ inputs.evidence }}")
          echo "evidence=${{ inputs.evidence }}" >> "$GITHUB_OUTPUT"
        fi
        node "${{ github.action_path }}/litmiq-ci.mjs" "${args[@]}"
